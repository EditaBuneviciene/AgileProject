name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  # Build Artifact
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Add project root to PYTHONPATH
      run: echo "PYTHONPATH=$PYTHONPATH:$(pwd)" >> $GITHUB_ENV

    - name: Install Dependencies
      run: |
        pip install -r requirements.txt
        pip install pytest pytest-cov beautifulsoup4 lxml

    - name: Create build artifact
      run: |
        mkdir build
        cp -r main.py api_connection.py index.html style.css app.js requirements.txt Dockerfile build/ || true
        [ -f Data.csv ] && cp Data.csv build/
        [ -f Data_Cleaned.csv ] && cp Data_Cleaned.csv build/

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: build-artifact
        path: build/

  # Test Artifact
  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@5
        with:
          python-version: "3.10"

      - name: Install testing dependencies
        run: |
         pip install --no-cache-dir -r requirements.txt
         pip install pytest pytest-cov

      - name: Run Tests
        run: |
         mkdir test-results
         pytest --maxfail=1 --disable-warnings \
         --junitxml=test-results/junit.xml || true

      - name: Upload test artifact
        uses: actions/upload-artifact@v4
        with:
         name: test-artifact
         path: test-results

  # Production Artifact
  production:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create production package
        run: |
          mkdir production
          cp -r main.py api_connection.py requirements.txt Dockerfile index.html style.css app.js production/
          [ -f Data.csv ] && cp Data.csv production/
          [ -f Data_Cleaned.csv ] && cp Data_Cleaned.csv production/
          zip -r production-package.zip production/

      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-artifact
          path: production-package.zip

