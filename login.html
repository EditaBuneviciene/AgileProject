<!DOCTYPE html>
 <!-- python -m http.server 8000 -->
 <!-- http://localhost:8000/login.html -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f3f3f3;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      background-color: white;
      border: 1px solid #ccc;
      border-radius: 10px;
      width: 350px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    h2 {
      margin-bottom: 5px;
    }

    input[type="email"],
    input[type="password"] {
      width: 90%;
      padding: 8px;
      margin: 8px 0;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background-color: #0056b3;
    }

    .links {
      margin-top: 15px;
      font-size: 14px;
    }

    .links a {
      color: #007bff;
      text-decoration: none;
      margin: 0 5px;
    }

    .links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>evSD_Group1 Project</h2>
    <h3>Login</h3>

    <form id="loginForm" onsubmit="return false;">
      <label for="email">Email Address</label><br>
      <input type="email" id="email" name="email" placeholder="Enter your email" required><br>

      <label for="password">Password</label><br>
      <input type="password" id="password" name="password" placeholder="Enter your password" required><br>

      <button type="button" onclick="login()">Login</button>
    </form>

    <div class="links">
      <a href="forgot_password.html">Forgot Password?</a><br><br>
      Don’t have an account?
      <a href="signup.html">Create Account</a>
    </div>
  </div>

  <script>
    function login() {
      const email = document.getElementById('email').value.trim().toLowerCase();
      const password = document.getElementById('password').value.trim();

      // Hardcoded allowed users — same as Flask
        const validUsers = {
              "dariusz@mail.com": "1234",
               "edita@mail.com": "1234",
               "ed@mail.com": "1234",
               "patrick@mail.com": "1234"
      };

      // Check if user exists
      if (!(email in validUsers)) {
         alert("User not found. Only demo accounts may log in.");
         return;
      }

      // Check password
      if (validUsers[email] !== password) {
        alert("Incorrect password.");
        return;
      }

      // Store simple session
      sessionStorage.setItem("loggedInUser", email);

      // Redirect to dashboard
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
